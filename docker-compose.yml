version: "3.9"

services:
  db:
    image: postgres:15
    container_name: msme_scheduler_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: msme_scheduler
      POSTGRES_USER: msme_user
      POSTGRES_PASSWORD: msme_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msme_user -d msme_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
