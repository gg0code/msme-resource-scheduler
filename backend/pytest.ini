# backend/pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: pure unit tests, no DB required
    integration: tests that use the DB or HTTP client
    slow: tests that take more than 1 second
